[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "Grounded-retrieval tools: ground or abstain, never invent. Every claim traceable to a verbatim, hash-matched source span."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Lifted Truck" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
mcp = [
  # Bounded on purpose (D57). 2.x implements the MODERN protocol era (2026-07-28):
  # no `initialize` handshake, per-request `_meta`, and a mandatory `server/discover`.
  # `mcp_server.py` is written against the legacy handshake API, so an unbounded pin
  # would silently pull 2.x and break the server on a fresh install. Moving to 2.x is
  # the modern-era upgrade and gets its own decision, not a version bump.
  "mcp>=1.28,<2",   # MCP server adapter (mcp_server.py); not needed for the Layer-0 gate
]
ocr = [
  # Ingestion-time drawing-sheet OCR (scripts/ocr_patent_figures.py, D28/D29).
  # Multi-engine with COMPLEMENTARY recall — Vision (darwin-only), RapidOCR
  # (cross-platform, ONNX, no torch), and the tesseract system binary (installed
  # separately: apt/brew install tesseract). NEVER a runtime or CI dependency —
  # runtime/CI consume only the frozen ocr_manifest.json via cairn.figures_map.
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "rapidocr-onnxruntime",
  "Pillow",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "layer0: deterministic component eval — the blocking CI gate (docs/layer0_gate.md)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
# Boring on purpose (brief §9). Pyflakes + pycodestyle + isort + bugbear.
select = ["E", "F", "I", "B"]
